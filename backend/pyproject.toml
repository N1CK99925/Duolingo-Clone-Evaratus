[project]
name = "duolingo-backend"
version = "0.1.0"
description = "Duolingo clone API backend (FastAPI + SQLite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]