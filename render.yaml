# Render blueprint for the backend API service (Docker).
# Use: Render Dashboard -> New -> Blueprint -> pick this repo.
# Frontend (Vercel) talks to the API same-origin via vercel.json rewrites, so no
# Vercel origin is needed here. Localhost listed for local dev only.
services:
  - type: web
    name: duo-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DUO_CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000
      # If you switch to direct cross-origin calls (NEXT_PUBLIC_BACKEND_URL set on
      # Vercel), add the Vercel URL here instead.
      # - key: DUO_DATABASE_URL
      #   value: sqlite:////var/data/duolingo.db
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1