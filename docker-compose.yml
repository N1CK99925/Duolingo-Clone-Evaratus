# Local full-stack: backend API on :8000 + statically exported frontend on :3000.
# (Production: backend on Render via render.yaml, frontend on Vercel — see docs/deployment-plan.md)
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend